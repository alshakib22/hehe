<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Love ❤️</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial,sans-serif;
color:white;
}

h1{
font-size:45px;
text-shadow:0 0 20px hotpink;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{opacity:.6;}
to{opacity:1;text-shadow:0 0 40px red;}
}

.heart{
position:absolute;
color:#ff4d6d;
font-size:25px;
animation:fall 6s linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-100vh);
opacity:1;
}
100%{
transform:translateY(100vh);
opacity:0;
}
}
</style>
</head>

<body>

<h1 id="text"></h1>

<audio autoplay loop controls style="position:fixed;bottom:10px;">
<source src="love.mp3" type="audio/mpeg">
</audio>

<script>
const msg="❤️ I LOVE YOU FOREVER ❤️";
let i=0;

function type(){
if(i<msg.length){
document.getElementById("text").innerHTML+=msg.charAt(i);
i++;
setTimeout(type,120);
}
}
type();

function createHeart(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*30)+"px";
heart.style.animationDuration=(3+Math.random()*4)+"s";
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},7000);
}

setInterval(createHeart,200);
</script>

</body>
</html>
